    PortalCallResponseOnlineForms:
      allOf:
        - $ref: "#/components/schemas/PortalCallResponse"
        - type: object
          properties:
            result:
              $ref: "#/components/schemas/OnlineFormsResponse"

    PortalCallResponseOnlineFormSubmission:
      allOf:
        - $ref: "#/components/schemas/PortalCallResponse"
        - type: object
          properties:
            result:
              $ref: "#/components/schemas/OnlineFormSubmissionResponse"

    PortalCallResponseOnlineFormContext:
