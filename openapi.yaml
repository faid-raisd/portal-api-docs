              - verifyFinancePaymentProof
              - postFinanceCounterPayment
              - recordGraduationDepartmentDecision
              - approveGraduationClearance
              - advanceGraduationDocument
              - advanceGraduationStudentPass
        note:
          type: string
          example: Staff progression is Admin Actions only until Live staff PortalApi exists.


    PortalFile:
      type: object
      required: [__portalFile, name, type, size]
      properties:
        __portalFile:
          type: boolean
          const: true
        name:
          type: string
        type:
          type: string
          example: application/pdf
        size:
          type: integer
          minimum: 0
        contentBase64:
          type: string
          description: Optional file bytes as base64

    CmsAck:
      type: object
      required: [acknowledged, mode]
      properties:
        acknowledged:
          type: boolean
        mode:
          type: string
          enum: [stub, live]
        note:
          type: string

    PortalCallResponse:
      type: object
      required: [result, cms]
      properties:
        result:
          description: |
            PortalApi return value for the invoked method (any JSON, including null).
            Demo flow responses for Immigration, Graduation, Module Registration,
            Online Forms, and Finance are frozen as named components below and on
            those operations. Remaining methods still follow student-portal Zod
            until CAP-53 freezes Live CMS contracts.
        cms:
          $ref: "#/components/schemas/CmsAck"

    PortalCallResponseImmigration:
      allOf:
        - $ref: "#/components/schemas/PortalCallResponse"
        - type: object
          properties:
            result:
              $ref: "#/components/schemas/ImmigrationResponse"

    PortalCallResponseGraduation:
      allOf:
        - $ref: "#/components/schemas/PortalCallResponse"
        - type: object
          properties:
            result:
              $ref: "#/components/schemas/AcademicGraduationResponse"

    PortalCallResponseModuleRegistration:
      allOf:
