          application/json:
            schema:
              $ref: "#/components/schemas/PortalCallRequest"
            example:
              args:
                - submissionId: sub-1
      responses:
        "200":
          description: Method succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalCallResponseOnlineFormSubmission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
