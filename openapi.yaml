components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
      description: Token from `POST /v1/auth/login`

  responses:
    BadRequest:
      description: Invalid body or PortalApi rejection
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unauthorized:
      description: Missing or expired bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: Session expired or missing. Sign in again.

  schemas:
    ScenarioId:
      type: string
      enum:
        - mid-programme
        - first-semester-registration
        - new-student-pass
        - graduation-ready

    PortalMethod:
      type: string
      description: |
        Methods exposed by the student PortalApi interface
        (55 methods; matches student-portal frontend hooks).
      enum:
        - getImmigration
        - getOnlineForms
        - getOnlineForm
        - getOnlineFormSubmission
        - startOnlineForm
        - saveOnlineFormDraft
        - submitOnlineForm
        - withdrawOnlineForm
        - sendOnlineFormMessage
        - markOnlineFormRead
        - getAnnouncements
        - getAnnouncement
        - getUniversityPolicies
        - getLecturerReview
        - submitLecturerReview
        - getDashboard
        - getAcademicPerformance
        - getAcademicModules
        - getAcademicTimetable
        - getAcademicGraduation
        - getAcademicStudyPlan
        - getAcademicModuleRegistration
        - getModuleRegistrationFeePreview
        - confirmModuleRegistrations
        - getAcademicContext
        - getAcademicModuleDetail
        - getAcademicModuleAttendance
        - getAcademicModuleMaterials
        - getAcademicModuleMaterialDetail
        - submitAssignment
        - deleteAssignmentSubmission
        - getPersonalProfile
        - updatePersonalProfile
        - getAcademicProfile
        - getDocumentsProfile
        - getPrivacySecurity
        - getServices
        - getServicePage
        - getResumeProfile
        - updateResumeProfile
        - getPortfolioProfile
        - createPortfolioProject
        - updatePortfolioProject
        - deletePortfolioProject
        - getCommunity
        - getCalendarMonth
        - getFinanceStatement
        - submitFinancePaymentProof
        - deleteFinancePaymentProof
        - getPortalRecordGraph
        - getChatConversations
        - getChatConversation
        - markChatConversationRead
        - sendChatMessage
        - deleteChatMessage

    HealthResponse:
      type: object
      required: [ok, service, mode, cms, time]
      properties:
        ok:
          type: boolean
        service:
          type: string
          example: portal-api
        mode:
          type: string
          example: stub-session
        sessions:
          type: string
          enum: [memory, postgres]
          description: Where session rows live. `postgres` when `DATABASE_URL` is set.
        cms:
          type: string
          example: stub
        time:
          type: string
          format: date-time

    MetaResponse:
      type: object
      required: [service, version, scenarios, defaultScenarioId, cmsMode, docs, openapi]
      properties:
        service:
          type: string
        version:
          type: string
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioId"
        defaultScenarioId:
          $ref: "#/components/schemas/ScenarioId"
        cmsMode:
          type: string
          example: stub
        sessions:
          type: string
          enum: [memory, postgres]
        docs:
          type: string
          example: /docs
        openapi:
          type: string
          example: /openapi.yaml
        note:
          type: string

    LoginRequest:
      type: object
      properties:
        scenarioId:
          $ref: "#/components/schemas/ScenarioId"

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, scenarioId, studentProfileId]
      properties:
        accessToken:
          type: string
          format: uuid
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Seconds until the session expires
        scenarioId:
          $ref: "#/components/schemas/ScenarioId"
        studentProfileId:
          type: string

    ProgrammeEnrolmentReadInput:
      type: object
      description: Optional enrolment scope shared by most student-portal reads
      additionalProperties: false
      properties:
        programmeEnrolmentId:
          type: ["string", "null"]

    OnlineFormInput:
      type: object
      required: [formId]
      additionalProperties: false
      properties:
        formId:
          type: string
        programmeEnrolmentId:
          type: ["string", "null"]

    OnlineFormSubmissionInput:
      type: object
      required: [submissionId]
      additionalProperties: false
      properties:
        submissionId:
          type: string
        programmeEnrolmentId:
          type: ["string", "null"]

    SaveOnlineFormDraftInput:
      allOf:
        - $ref: "#/components/schemas/OnlineFormSubmissionInput"
        - type: object
          required: [answers, revision]
          properties:
            answers:
              type: object
              additionalProperties: true
            revision:
              type: integer
              minimum: 0

    SubmitOnlineFormInput:
      allOf:
        - $ref: "#/components/schemas/OnlineFormSubmissionInput"
        - type: object
          required: [revision]
          properties:
            revision:
              type: integer
              minimum: 0

    SendOnlineFormMessageInput:
      allOf:
        - $ref: "#/components/schemas/OnlineFormSubmissionInput"
