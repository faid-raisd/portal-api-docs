paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                ok: true
                service: portal-api
                mode: stub-session
                sessions: postgres
                cms: stub
                time: "2026-09-21T09:25:12.975Z"

  /openapi.yaml:
    get:
      tags: [Health]
      operationId: getOpenApiDocument
      summary: OpenAPI document
      description: Returns this OpenAPI YAML from the control-plane repository root, or redirects to the GitHub Pages copy when the spec is not packaged (Vercel Demo).
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 YAML
          content:
            application/yaml:
              schema:
                type: string
        "302":
          description: Redirect to https://raisd-campus.github.io/portal-api-docs/openapi.yaml

  /docs:
    get:
      tags: [Health]
      operationId: getSwaggerUi
      summary: Swagger UI
      description: Interactive explorer for this API (same UI as GitHub Pages). Redirects to GitHub Pages when the HTML is not packaged (Vercel Demo).
      security: []
      responses:
        "200":
          description: HTML Swagger UI
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Redirect to https://raisd-campus.github.io/portal-api-docs/openapi.html

  /v1/meta:
    get:
      tags: [Health]
      operationId: getMeta
      summary: Service metadata and supported scenarios
      security: []
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
              example:
                service: portal-api
                version: 0.1.0
                scenarios:
                  - mid-programme
                  - first-semester-registration
                  - new-student-pass
                  - graduation-ready
                defaultScenarioId: first-semester-registration
                cmsMode: stub
                sessions: postgres
                docs: /docs
                openapi: /openapi.yaml
                note: Sessions use MockPortalApi until CAP-53 connects the existing CMS.


  /v1/meta/staff-progression:
    get:
      tags: [Meta]
      operationId: staffProgressionDeferred
      summary: Describe deferred Live staff progression contracts
      description: |
        Documents reserved staff PortalApi method names for Immigration,
        Graduation, Online Forms review, and Finance proof verification.
        These are not callable in Stage 1. Demo staff advances use
        student-portal Admin Actions (`runDevelopmentAction`, HTTP-blocked).
      security: []
      responses:
        "200":
          description: Deferred staff contract catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProgressionDeferred"
              example:
                status: deferred
                reservedMethods:
                  - reviewOnlineForm
                  - advanceImmigrationCase
                  - verifyFinancePaymentProof
                  - postFinanceCounterPayment
                  - recordGraduationDepartmentDecision
                  - approveGraduationClearance
                  - advanceGraduationDocument
                  - advanceGraduationStudentPass
                note: Staff progression is Admin Actions only until Live staff PortalApi exists.


  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Create a demo student session
      description: |
        Issues a bearer token bound to a student scenario.
        No password yet — stage-1 demo auth only.
        Used by `createHttpPortalApi` in student-portal.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              default:
                value: {}
              midProgramme:
                value:
                  scenarioId: mid-programme
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session
      description: Ends the bearer session. `createHttpPortalApi` calls this when the HTTP handle is disposed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session destroyed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/scenario:
    post:
      tags: [Auth]
      operationId: switchScenario
      summary: Switch the demo student scenario on the current session
      description: |
        Preferred remote alternative to MockPortalApi.selectStudentScenario
        (which is blocked over HTTP). The student-portal HTTP client calls this
        endpoint via `getHttpPortalHandle().switchScenario` when switching Demo
        scenarios.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenarioId]
              properties:
                scenarioId:
                  $ref: "#/components/schemas/ScenarioId"
      responses:
        "200":
          description: Scenario switched
          content:
            application/json:
              schema:
                type: object
                required: [scenarioId, studentProfileId]
                properties:
                  scenarioId:
                    $ref: "#/components/schemas/ScenarioId"
                  studentProfileId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # --- PortalApi methods (one operation per student-portal method) ---
  /v1/portal/getImmigration:
    post:
      tags: [Immigration]
      operationId: portal_getImmigration
      summary: Get student pass / immigration case
      description: |
        Optional enrolment scope. `args`: `[]` or `[ProgrammeEnrolmentReadInput]`.
        Result is wrapped with stub CMS acknowledgement.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalCallRequest"
            example:
              args:
                - programmeEnrolmentId: null
      responses:
        "200":
          description: Method succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalCallResponseImmigration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or blocked method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /v1/portal/getOnlineForms:
    post:
      tags: [Online forms]
      operationId: portal_getOnlineForms
      summary: List online forms and submissions
      description: |
        Optional enrolment scope. `args`: `[]` or `[ProgrammeEnrolmentReadInput]`.
        Result is wrapped with stub CMS acknowledgement.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalCallRequest"
            example:
              args:
                - {}
      responses:
        "200":
          description: Method succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalCallResponseOnlineForms"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or blocked method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /v1/portal/getOnlineForm:
    post:
      tags: [Online forms]
      operationId: portal_getOnlineForm
      summary: Get one online form context
      description: |
        `args`: `[OnlineFormInput]`.
        Result is wrapped with stub CMS acknowledgement.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalCallRequest"
            example:
              args:
                - formId: form-visa-renewal
      responses:
        "200":
          description: Method succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalCallResponseOnlineFormContext"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or blocked method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /v1/portal/getOnlineFormSubmission:
    post:
      tags: [Online forms]
      operationId: portal_getOnlineFormSubmission
      summary: Get an online form submission
      description: |
        `args`: `[OnlineFormSubmissionInput]`.
