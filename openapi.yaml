          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /v1/portal/startOnlineForm:
    post:
      tags: [Online forms]
      operationId: portal_startOnlineForm
      summary: Start an online form submission
      description: |
        `args`: `[OnlineFormInput]`.
        Result is wrapped with stub CMS acknowledgement.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalCallRequest"
            example:
              args:
                - formId: form-visa-renewal
      responses:
        "200":
          description: Method succeeded
          content:
            application/json:
              schema:
