    OnlineFormAttachment:
      type: object
      required: [id, kind, name, mimeType, sizeBytes, sizeLabel]
      description: |
        Online Forms / chat-style message attachment metadata.
        Constraints: sizeBytes <= 26214400 (25 MiB); arrays max 5 items and
        78643200 bytes total. Image kind requires a safe raster MIME type.
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          enum: [image, file]
        name:
          type: string
          minLength: 1
        mimeType:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
          maximum: 26214400
        sizeLabel:
          type: string
          minLength: 1
        src:
          type: string
          description: "Optional blob: preview URL for safe inline images (session-only)"

    ImmigrationCaseStatus:
      type: string
      enum:
        - submitted
        - information-required
        - rejected
        - documents-accepted
        - emgs-processing
        - eval-approved
        - arrival-medical
        - awaiting-passport
        - passport-received
        - endorsement-processing
        - cancellation-processing
        - cancelled
        - ready-for-collection
        - completed

    ImmigrationCaseType:
      type: string
      enum: [new, renewal, cancellation]

    OnlineFormStatus:
      type: string
      enum: [draft, submitted, under-review, completed, rejected, withdrawn]

    FinanceInvoiceStatus:
      type: string
      enum: [unpaid, partially-paid, paid, void]

    FinanceProofStatus:
      type: string
      enum: [pending, verified, rejected]

    GraduationStudentPassStatus:
      type: string
      description: |
        Graduation hub projection of a graduation-triggered Immigration
        cancellation. Immigration `completed` maps to `passport-returned`
        (see student-portal immigration-graduation-projection.ts).
      enum:
        - awaiting-handover
        - passport-received
        - cancellation-processing
        - cancelled
        - ready-for-collection
        - passport-returned

    ImmigrationStepValue:
      type: string
      enum: ["1", "2", "3", "4", "5"]

    ImmigrationResponse:
      type: object
      description: Demo wire contract for getImmigration (Zod immigrationResponseSchema).
      required:
        - studentProfileId
        - programmeEnrolmentId
        - campusId
        - timeZone
        - configured
        - applicable
        - officeName
        - passportCollectionLocation
        - currentPass
        - applicationActions
        - case
        - steps
        - recommendedStep
      properties:
        studentProfileId: { type: string, minLength: 1 }
        programmeEnrolmentId: { type: string, minLength: 1 }
        campusId: { type: string, minLength: 1 }
        timeZone: { type: string, minLength: 1 }
        configured: { type: boolean }
        applicable: { type: boolean }
        officeName: { type: ["string", "null"] }
        passportCollectionLocation: { type: ["string", "null"] }
        currentPass:
          type: ["object", "null"]
          required: [id, passType, passNumber, passportNumber, passportExpiresOn, passExpiresOn, status, cancelledAt]
          properties:
            id: { type: string, minLength: 1 }
            passType: { type: string, minLength: 1 }
            passNumber: { type: string, minLength: 1 }
            passportNumber: { type: string, minLength: 1 }
            passportExpiresOn: { type: string, format: date }
            passExpiresOn: { type: string, format: date }
            status: { type: string, enum: [valid, expiring, expired, cancelled] }
            cancelledAt: { type: ["string", "null"], format: date-time }
        applicationActions:
          type: array
          items:
            type: object
            required: [caseType, formId, label, available, reason]
            properties:
              caseType: { $ref: "#/components/schemas/ImmigrationCaseType" }
              formId: { type: string, minLength: 1 }
              label: { type: string, minLength: 1 }
              available: { type: boolean }
              reason: { type: ["string", "null"] }
        case:
          type: ["object", "null"]
          description: Extended Immigration case with invoice, documents, events, progress, medical form link
          required:
            - id
            - studentProfileId
            - programmeEnrolmentId
            - campusId
            - caseType
            - trigger
            - formSubmissionId
            - visaPassId
            - invoiceId
            - feeWaived
            - status
            - submittedAt
            - updatedAt
            - completedAt
            - updatedPassExpiresOn
            - medicalResult
            - revision
            - reference
            - invoice
            - invoicePaid
            - documents
            - events
            - progress
            - medicalFormSubmission
          properties:
            id: { type: string, minLength: 1 }
            studentProfileId: { type: string, minLength: 1 }
            programmeEnrolmentId: { type: string, minLength: 1 }
            campusId: { type: string, minLength: 1 }
            caseType: { $ref: "#/components/schemas/ImmigrationCaseType" }
            trigger: { type: string, enum: [student-requested, graduation, university-directed] }
            formSubmissionId: { type: ["string", "null"] }
            visaPassId: { type: ["string", "null"] }
            invoiceId: { type: ["string", "null"] }
            feeWaived: { type: boolean }
            status: { $ref: "#/components/schemas/ImmigrationCaseStatus" }
            submittedAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            completedAt: { type: ["string", "null"], format: date-time }
            updatedPassExpiresOn: { type: ["string", "null"], format: date }
            medicalResult:
              type: ["object", "null"]
              required: [id, name, mimeType, sizeBytes, submittedAt]
              properties:
                id: { type: string, minLength: 1 }
                name: { type: string, minLength: 1 }
                mimeType: { type: string, minLength: 1 }
                sizeBytes: { type: integer, minimum: 1 }
                submittedAt: { type: string, format: date-time }
            revision: { type: integer, minimum: 0 }
            reference: { type: ["string", "null"] }
            invoice: { oneOf: [{ $ref: "#/components/schemas/FinanceInvoice" }, { type: "null" }] }
            invoicePaid: { type: boolean }
            documents:
              type: array
              items: { $ref: "#/components/schemas/ImmigrationDocumentCheck" }
            events:
              type: array
              items: { $ref: "#/components/schemas/ImmigrationCaseEvent" }
            progress:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/ImmigrationProgressMilestone" }
            medicalFormSubmission:
              type: ["object", "null"]
              required: [id, status]
              properties:
                id: { type: string, minLength: 1 }
                status: { $ref: "#/components/schemas/OnlineFormStatus" }
        steps:
          type: array
          minItems: 3
          maxItems: 5
          items:
            type: object
            required: [value, label, title, complete, available]
            properties:
              value: { $ref: "#/components/schemas/ImmigrationStepValue" }
              label: { type: string, minLength: 1 }
              title: { type: string, minLength: 1 }
              complete: { type: boolean }
              available: { type: boolean }
        recommendedStep: { $ref: "#/components/schemas/ImmigrationStepValue" }

    ImmigrationDocumentCheck:
      type: object
      required: [id, immigrationCaseId, label, status, note, updatedAt]
      properties:
        id: { type: string, minLength: 1 }
        immigrationCaseId: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        status: { type: string, enum: [pending, action-required, accepted] }
        note: { type: string }
        updatedAt: { type: string, format: date-time }

    ImmigrationCaseEvent:
      type: object
      required: [id, immigrationCaseId, status, label, occurredAt]
      properties:
        id: { type: string, minLength: 1 }
        immigrationCaseId: { type: string, minLength: 1 }
        status: { $ref: "#/components/schemas/ImmigrationCaseStatus" }
        label: { type: string, minLength: 1 }
        occurredAt: { type: string, format: date-time }

    ImmigrationProgressMilestone:
      type: object
      required: [id, label, state, statusLabel, occurredAt]
      properties:
        id: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        state: { type: string, enum: [completed, current, upcoming] }
        statusLabel: { type: string, minLength: 1 }
        occurredAt: { type: ["string", "null"], format: date-time }

    AcademicGraduationResponse:
      type: object
      description: Demo wire contract for getAcademicGraduation.
      required:
        - studentProfileId
        - programmeEnrolmentId
        - campusId
        - timeZone
        - configured
        - collectionLocation
        - academicCompletedOn
        - eligibility
        - process
        - application
        - invoice
        - accountSettled
        - convocation
        - complete
      properties:
        studentProfileId: { type: string, minLength: 1 }
        programmeEnrolmentId: { type: string, minLength: 1 }
        campusId: { type: string, minLength: 1 }
        timeZone: { type: string, minLength: 1 }
        configured: { type: boolean }
        collectionLocation: { type: ["string", "null"] }
        academicCompletedOn: { type: ["string", "null"], format: date }
        eligibility:
          type: object
          required: [eligible, checks]
          properties:
            eligible: { type: boolean }
            checks:
              type: array
              items:
                type: object
                required: [id, label, met, detail]
                properties:
                  id: { type: string }
                  label: { type: string }
                  met: { type: boolean }
                  detail: { type: string }
        process:
          type: ["object", "null"]
          required:
            - id
            - studentProfileId
            - programmeEnrolmentId
            - campusId
            - clearanceSubmissionId
            - approvedAt
            - invoiceId
            - convocationSubmissionId
            - checks
            - documents
            - studentPass
            - createdAt
            - revision
          properties:
            id: { type: string, minLength: 1 }
            studentProfileId: { type: string, minLength: 1 }
            programmeEnrolmentId: { type: string, minLength: 1 }
            campusId: { type: string, minLength: 1 }
            clearanceSubmissionId: { type: string, minLength: 1 }
            approvedAt: { type: ["string", "null"], format: date-time }
            invoiceId: { type: ["string", "null"] }
            convocationSubmissionId: { type: ["string", "null"] }
            checks:
              type: array
              minItems: 3
              maxItems: 3
              items: { $ref: "#/components/schemas/GraduationClearanceCheck" }
            documents:
              type: array
              minItems: 3
              maxItems: 3
              items: { $ref: "#/components/schemas/GraduationDocument" }
            studentPass:
              type: ["object", "null"]
              required: [visaPassId, immigrationCaseId, status, updatedAt]
              properties:
                visaPassId: { type: string, minLength: 1 }
                immigrationCaseId: { type: ["string", "null"] }
                status: { $ref: "#/components/schemas/GraduationStudentPassStatus" }
                updatedAt: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
            revision: { type: integer, minimum: 0 }
        application: { oneOf: [{ $ref: "#/components/schemas/OnlineFormSummary" }, { type: "null" }] }
        invoice: { oneOf: [{ $ref: "#/components/schemas/FinanceInvoice" }, { type: "null" }] }
        accountSettled: { type: boolean }
        convocation:
          type: ["object", "null"]
          required: [submission, attendance, gownSize]
          properties:
            submission: { $ref: "#/components/schemas/OnlineFormSummary" }
            attendance: { type: ["string", "null"] }
            gownSize: { type: ["string", "null"] }
        complete: { type: boolean }

    GraduationClearanceCheck:
      type: object
      required: [id, department, status, note, updatedAt]
      properties:
        id: { type: string, minLength: 1 }
        department: { type: string, enum: [Faculty, Finance, Library] }
        status: { type: string, enum: [pending, action-required, cleared] }
        note: { type: string }
        updatedAt: { type: string, format: date-time }

    GraduationDocument:
      type: object
      required: [id, title, status, updatedAt, collectedAt]
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string, enum: ["Completion letter", Transcript, Scroll] }
        status: { type: string, enum: [not-started, preparing, ready, collected] }
        updatedAt: { type: string, format: date-time }
        collectedAt: { type: ["string", "null"], format: date-time }

    ModuleRegistrationConfirmationAccess:
      oneOf:
        - type: object
          required: [code, canConfirm, reason]
          properties:
            code: { type: string, const: available }
            canConfirm: { type: boolean, const: true }
