        state:
          type: string
          enum:
            - not-required
            - current
            - new-application-required
            - pre-eval
            - post-eval
            - rejected
            - expired
            - cancelled
            - unavailable
        caseStatus:
          oneOf:
            - $ref: "#/components/schemas/ImmigrationCaseStatus"
            - type: "null"

    PortalProgramme:
      type: object
