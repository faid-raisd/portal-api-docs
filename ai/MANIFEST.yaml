notes:
  - 2026-09-23: Cyberjaya old CMS dump inventoried; CAP comparison at backend/cms-feature-comparison.md (SDD-14).
  - 2026-09-25: Cyberjaya E2E hub deepened (flows, ERD, DFD, integrations, three-campus comparison); satellite pages redirect to hub anchors.
  - 2026-09-23: SDD-15 nomenclature — CAP-* and M1–M5 anchors/cross-links (../sdd/15-nomenclature.md).
  - 2026-09-23: ICA Sierra Leone CMS dump inventoried (ems_sierraleone); docs/ai/backend/old-cms-sierra-leone.md + diagrams/old-cms-sierra-leone/.
  - 2026-09-25: Sierra Leone E2E hub deepened (flows, ERD, DFD, integrations, three-campus comparison) from ICA_SierraLeone package re-analysis.
  - 2026-09-24: LUCT Botswana CMS dump inventoried (cmsbotswana); docs/ai/backend/old-cms-botswana.md + diagrams/old-cms-botswana/.
  - 2026-09-25: Botswana DTEF scholarship → TEF.gov.bw sync analysed (functional + technical); backend/botswana-dtef-scholarship-sync.md + diagrams/old-cms-botswana/dtef-scholarship-sync.html.
  - 2026-09-23: Raisd CMS Student portal capabilities, screenshots, and use guides under diagrams/raisd-cms/.
  - 2026-09-24: Distributed CMS target (one product, country data planes, white-label/flags) — architecture/distributed-cms-target.md + diagrams/distributed-cms-architecture.html.
  - 2026-09-26: FSD Obsidian 3D knowledge graph (breakdown / walkthrough / click) — diagrams/old-cms/obsidian.html + fsd-knowledge.json; LUCT CMS campus submenus.
  - 2026-09-27: PoC Vercel + Neon deploy path (SPA + Portal API + free Postgres) — architecture/vercel-neon-poc.md; does not replace SDD-12.
  - 2026-09-27: Published HTML Primary nav + design-system subnav derive from docs/site-nav.yaml (build-dropdown-nav.py).
  - 2026-09-27: Portal API service split into raisd-campus/portal-api (history kept); openapi.yaml stays here. Added development plan, target deployment and PoC requirements under backend/.
  - 2026-10-01: Canonical record schema reviewed against LUCT reporting issues; proposed changes at backend/canonical-schema-luct-readiness.md. ERD generated columns now come from the Zod contract, not seed rows.
  - 2026-10-01: Schema v2 implemented (lifecycle, identifiers, access, finance corrections, audit_events, reporting views). Status updated in canonical-schema-luct-readiness.md §7; published ERD and PoC Neon notes refreshed.
  - 2026-10-01: Published pending confirmation agenda (CS-01–CS-13) at diagrams/canonical-schema-confirmations.html; linked from ERD, architecture status, SDD-10 Q29–Q36.

