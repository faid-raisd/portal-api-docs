name: Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - openapi.yaml
      - index.html
      - diagrams/**
      - ai/**
      - sdd/**
      - design-system/**
      - .github/workflows/pages.yml
      - scripts/validate-design-system.py
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@1
      - name: Lint openapi.yaml
        run: redocly lint openapi.yaml --extends=minimal
      - name: Validate design system pages
        run: python3 scripts/validate-design-system.py .

  pages:
    name: Deploy GitHub Pages
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        env:
          DOCS_SITE_USER: ${{ secrets.DOCS_SITE_USER }}
          DOCS_SITE_PASSWORD: ${{ secrets.DOCS_SITE_PASSWORD }}
        run: |
          mkdir -p _site
          cp index.html openapi.yaml _site/
          cp -R diagrams _site/diagrams
          cp -R ai _site/ai
          if [ -d sdd ]; then cp -R sdd _site/sdd; fi
          if [ -d design-system ]; then cp -R design-system _site/design-system; fi
          test -f _site/diagrams/erd.html
          test -f _site/diagrams/dfd.html
          test -f _site/diagrams/old-cms/index.html
          test -f _site/diagrams/old-cms/comparison.html
          test -f _site/diagrams/migration.html
          test -f _site/diagrams/raisd-cms/index.html
          test -f _site/diagrams/old-cms-botswana/index.html
          test -f _site/diagrams/old-cms-botswana/database.html
          test -f _site/diagrams/old-cms-sierra-leone/index.html
          test -f _site/ai/index.html
          test -f _site/sdd/15-nomenclature.html
          test -f _site/sdd/11-capability-catalog.html
          test -f _site/sdd/03-delivery-milestones.html
          test -f _site/sdd/index.html
          test -f _site/design-system/index.html
          test -f _site/design-system/foundations.html
          test -f _site/design-system/shared-controls.html
          test -f _site/design-system/shared-patterns.html
          test -f _site/design-system/student-components.html
          test -f _site/design-system/styles.css
          test -f _site/design-system/captures.json
          test -f _site/diagrams/glossary.json
          test -f _site/diagrams/abbr-tooltips.js
          test -f _site/diagrams/site-auth.js
          test -f _site/diagrams/site-auth-config.json
          python3 scripts/assemble-site-auth.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
