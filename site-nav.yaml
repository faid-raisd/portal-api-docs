# Raisd Control Plane / portal-api-docs — primary site navigation
#
# Single source of truth for the published HTML header menu.
# Regenerate after editing:
#   python docs/sdd/_pages/build-dropdown-nav.py
#
# Design-system in-page subnav also reads `design_subnav` from this file
# (via scripts/build-design-system-pages.py).

brand:
  title: Control Plane
  home: diagrams/index.html
  logo: diagrams/assets/raisd-logo.svg
  favicon: diagrams/assets/favicon.svg

# Logical page ids → paths relative to the published docs root
# (control-plane/docs or portal-api-docs/).
targets:
  overview: diagrams/index.html
  distributed: diagrams/distributed-cms-architecture.html
  architecture: diagrams/architecture.html
  migration: diagrams/migration.html
  raisd: diagrams/raisd-cms/index.html
  raisd-sp: diagrams/raisd-cms/student-portal.html
  raisd-sp-shots: diagrams/raisd-cms/student-portal-screenshots.html
  raisd-sp-guide: diagrams/raisd-cms/student-portal-guide.html
  raisd-sp-manual: diagrams/raisd-cms/student-portal-manual.html
  erd: diagrams/erd.html
  dfd: diagrams/dfd.html
  luct: diagrams/old-cms/index.html
  luct-comparison: diagrams/old-cms/comparison.html
  luct-fsd: diagrams/old-cms/fsd.html
  luct-obsidian: diagrams/old-cms/obsidian.html
  luct-erd: diagrams/old-cms/erd.html
  luct-flows: diagrams/old-cms/flows.html
  luct-database: diagrams/old-cms/database.html
  luct-bw: diagrams/old-cms-botswana/index.html
  luct-bw-database: diagrams/old-cms-botswana/database.html
  luct-sl: diagrams/old-cms-sierra-leone/index.html
  luct-sl-database: diagrams/old-cms-sierra-leone/database.html
  ai: ai/index.html
  design-system: design-system/index.html
  design-foundations: design-system/foundations.html
  design-controls: design-system/shared-controls.html
  design-patterns: design-system/shared-patterns.html
  design-student: design-system/student-components.html
  sdd: sdd/index.html
  sdd-15: sdd/15-nomenclature.html
  sdd-11: sdd/11-capability-catalog.html
  sdd-03: sdd/03-delivery-milestones.html
  openapi: openapi.html
  vercel-poc: poc/vercel-neon.html

# External (absolute) link ids used in the menu
external:
  agents-md: https://github.com/raisd-campus/control-plane/blob/main/docs/ai/AGENTS.md
  ai-architecture: https://github.com/raisd-campus/control-plane/blob/main/docs/ai/architecture/overview.md
  ai-distributed: https://github.com/raisd-campus/control-plane/blob/main/docs/ai/architecture/distributed-cms-target.md
  ai-portal-api: https://github.com/raisd-campus/control-plane/blob/main/docs/ai/backend/portal-api.md
  ai-portal-api-plan: https://github.com/raisd-campus/control-plane/blob/main/docs/ai/backend/portal-api-development-plan.md
  ai-portal-api-deploy: https://github.com/raisd-campus/control-plane/blob/main/docs/ai/backend/portal-api-deployment.md
  ai-portal-api-poc: https://github.com/raisd-campus/control-plane/blob/main/docs/ai/backend/portal-api-poc-requirements.md
  ai-cms-comparison: https://github.com/raisd-campus/control-plane/blob/main/docs/ai/backend/cms-feature-comparison.md
  openapi-yaml: https://github.com/raisd-campus/control-plane/blob/main/openapi.yaml
  ai-vercel-poc-md: https://github.com/raisd-campus/control-plane/blob/main/docs/ai/architecture/vercel-neon-poc.md

# Path → active section id (first match wins; evaluated in order)
path_rules:
  - match: { exact: openapi.html }
    section: openapi
  - match: { exact: diagrams/distributed-cms-architecture.html }
    section: distributed
  - match: { prefix: diagrams/old-cms-botswana/, file: database.html }
    section: luct-bw-database
  - match: { prefix: diagrams/old-cms-botswana/ }
    section: luct-bw
  - match: { prefix: diagrams/old-cms-sierra-leone/, file: database.html }
    section: luct-sl-database
  - match: { prefix: diagrams/old-cms-sierra-leone/ }
    section: luct-sl
  - match: { prefix: diagrams/old-cms/, file: comparison.html }
    section: luct-comparison
  - match: { prefix: diagrams/old-cms/, file: fsd.html }
    section: luct-fsd
  - match: { prefix: diagrams/old-cms/, file: obsidian.html }
    section: luct-obsidian
  - match: { prefix: diagrams/old-cms/, file: erd.html }
    section: luct-erd
  - match: { prefix: diagrams/old-cms/, file: flows.html }
    section: luct-flows
  - match: { prefix: diagrams/old-cms/, file: database.html }
    section: luct-database
  - match: { prefix: diagrams/old-cms/ }
    section: luct
  - match: { path_contains: raisd-cms, name_contains: student-portal-manual }
    section: raisd-sp-manual
  - match: { path_contains: raisd-cms, name_contains: student-portal-guide }
    section: raisd-sp-guide
  - match: { path_contains: raisd-cms, name_contains: student-portal-screenshots }
    section: raisd-sp-shots
  - match: { path_contains: raisd-cms, name_contains: student-portal }
    section: raisd-sp
  - match: { path_contains: raisd-cms }
    section: raisd
  - match: { file: erd.html, path_not_contains: old-cms }
    section: erd
  - match: { file: dfd.html }
    section: dfd
  - match: { file: architecture.html }
    section: architecture
  - match: { file: migration.html }
    section: migration
  - match: { exact: diagrams/index.html }
    section: overview
  - match: { prefix: ai/ }
    section: ai
  - match: { prefix: design-system/ }
    section: design-system
  - match: { prefix: sdd/, name_contains: 15-nomenclature }
    section: sdd-15
  - match: { prefix: sdd/, name_contains: 11-capability }
    section: sdd-11
  - match: { prefix: sdd/, name_contains: 03-delivery }
    section: sdd-03
  - match: { prefix: sdd/ }
    section: sdd
  - match: { prefix: poc/ }
    section: vercel-poc

